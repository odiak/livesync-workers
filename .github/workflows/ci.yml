name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # prepare スクリプトで packages/livesync-workers の build も走る
      - run: npm ci

      - run: npm run typecheck

      - run: npm test

      - run: npm run typecheck:workers

      - run: npm run test:workers

      - run: npm run test:performance

      - name: Upload benchmark measurements
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: livesync-benchmarks
          path: .local/benchmarks/latest.json
          include-hidden-files: true
          retention-days: 14
